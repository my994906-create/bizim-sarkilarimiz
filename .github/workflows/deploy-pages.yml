name: GitHub Pages’e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Bağımlılıkları yükle
        run: pnpm install --frozen-lockfile

      - name: Tür denetimi
        run: pnpm check

      - name: Uygulamayı derle
        run: pnpm build

      - name: Pages paketi oluştur
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages’e dağıt
        id: deployment
        uses: actions/deploy-pages@v4
